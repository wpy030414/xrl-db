[package]
name = "xrl-db"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
openraft = "0.9"
redb = "4"
redis-protocol = { version = "6.0.0", features = ["codec", "bytes"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-util = "0.7.19"
toml = "1"

[dev-dependencies]
proptest = "1"
turmoil = "0.7"
