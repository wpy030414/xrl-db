[package]
name = "xrl-db"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
openraft = "0.9"
redb = "4"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
toml = "1"

[dev-dependencies]
proptest = "1"
turmoil = "0.7"
