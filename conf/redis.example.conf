# XRLDB 示例配置（redis.conf 风格）
#
# 与 conf/xrldb.example.toml 语义完全等价，仅格式不同。
# 沿用 Redis 的运维可以直接把现有的 redis.conf 改写成本格式使用。
#
# 支持的配置项是本项目自有语义的一个子集，完整清单见 docs/PRD.md。
# 遇到不认识的配置项会直接报错而非静默忽略——静默忽略配置是运维事故的经典成因。

bind 127.0.0.1
port 7001

dir ./data/node-1

cluster-enabled yes
cluster-node-id 1
cluster-peer 1 127.0.0.1:7001
cluster-peer 2 127.0.0.1:7002
cluster-peer 3 127.0.0.1:7003

cluster-election-timeout-ms 300
cluster-heartbeat-interval-ms 100
